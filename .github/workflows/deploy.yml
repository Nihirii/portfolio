name: Publier sur GitHub Pages

# Lancement manuel seulement (onglet Actions) : la publication se fait pour l'instant
# en poussant le site construit sur la branche gh-pages (voir README).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx ng build --base-href /portfolio/
      # liens directs (#hubtv…) : la page d'accueil sert aussi de page 404
      - run: cp dist/portfolio/browser/index.html dist/portfolio/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/portfolio/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
