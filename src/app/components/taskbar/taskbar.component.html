<div class="taskbar">
    <button class="start-btn" (click)="toggleMenu()">🚩 Start</button>
  
    <div class="start-menu" *ngIf="showMenu">
      <button *ngFor="let win of closedWindows" (click)="onClickWindow(win)">
        {{ win | titlecase }}
      </button>
    </div>
  
    <div class="tabs">
      <button *ngFor="let win of openedWindows"
              [ngClass]="{ 'minimized': win.status === 'minimized', 'active': win.status === 'open' }"
              (click)="win.status === 'minimized' ? windowService.open(win.name) : windowService.minimize(win.name)">
        {{ win.name | titlecase }}
        <span class="close-btn" (click)="windowService.close(win.name); $event.stopPropagation()">✖️</span>
      </button>
    </div>
    <div class="taskbar-right">
      <div class="lang-switch" (click)="toggleLangMenu()">
        🌐
        <div class="lang-menu" *ngIf="showLangMenu">
          <button (click)="setLang('fr')">🇫🇷 Français</button>
          <button (click)="setLang('en')">🇬🇧 English</button>
        </div>
      </div>
      <span class="clock">{{ time }}</span>
  </div>

  </div>
